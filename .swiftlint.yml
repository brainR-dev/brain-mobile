# SwiftLint Configuration for BrainRush

disabled_rules:
  - trailing_whitespace
  - line_length

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - sorted_first_last
  - sorted_imports
  - vertical_parameter_alignment_on_call

excluded:
  - Pods
  - .build
  - DerivedData
  - fastlane
  - BrainRush/BrainRushTests
  - BrainRush/BrainRushUITests

line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 100
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - id
    - ok
    - url
    - api

type_name:
  min_length: 3
  max_length: 60

reporter: "xcode"
